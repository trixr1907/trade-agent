services:
  agent:
    build: .
    container_name: crypto-signal-agent
    ports:
      - "8000:8000"
    environment:
      TRADING_MODE: paper
      RISK_MAX_DRAWDOWN_PCT: 0.15
      RISK_KELLY_FRACTION: 0.25
      RISK_ATR_STOP_MULT: 2.5
      RISK_MIN_SCORE: 60
    # API-Keys über secrets/ env, nicht in dieser Datei.
    restart: unless-stopped
